<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文學習與測驗系統 - 首頁門戶</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.3);
      
      --secondary: #14b8a6;
      --secondary-glow: rgba(20, 184, 166, 0.3);
      
      --shadow-base: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 2rem;
    }

    /* Ambient background glowing orbs */
    .glow-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.4;
      pointer-events: none;
    }

    .orb-1 {
      top: -10%;
      left: -10%;
      background: var(--primary);
    }

    .orb-2 {
      bottom: -10%;
      right: -10%;
      background: var(--secondary);
    }

    .container {
      max-width: 1000px;
      width: 100%;
      z-index: 1;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    header {
      margin-bottom: 3.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #ffffff, #c7d2fe, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Cards Layout */
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2.5rem;
      margin-bottom: 4rem;
    }

    .portal-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: var(--transition);
      box-shadow: var(--shadow-base);
      position: relative;
      overflow: hidden;
    }

    .portal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      transition: var(--transition);
    }

    .card-quiz::before { background: linear-gradient(90deg, #6366f1, #818cf8); }
    .card-exam::before { background: linear-gradient(90deg, #14b8a6, #2dd4bf); }

    .portal-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .card-quiz:hover {
      box-shadow: 0 20px 40px var(--primary-glow);
    }

    .card-exam:hover {
      box-shadow: 0 20px 40px var(--secondary-glow);
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      transition: var(--transition);
    }

    .card-quiz .icon-wrapper {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--primary);
    }

    .card-exam .icon-wrapper {
      background: rgba(20, 184, 166, 0.15);
      border: 1px solid rgba(20, 184, 166, 0.2);
      color: var(--secondary);
    }

    .portal-card:hover .icon-wrapper {
      transform: scale(1.1) rotate(5deg);
    }

    .card-quiz:hover .icon-wrapper {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 20px var(--primary);
    }

    .card-exam:hover .icon-wrapper {
      background: var(--secondary);
      color: #ffffff;
      box-shadow: 0 0 20px var(--secondary);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
      transition: var(--transition);
    }

    .card-quiz:hover .card-title { color: #c7d2fe; }
    .card-exam:hover .card-title { color: #99f6e4; }

    .card-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 2rem;
      text-align: center;
    }

    .card-action {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .card-quiz .card-action { color: #a5b4fc; }
    .card-exam .card-action { color: #2dd4bf; }

    .portal-card:hover .card-action {
      gap: 0.85rem;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: var(--transition);
    }

    footer {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 2rem;
      width: 100%;
      max-width: 600px;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }

    footer a:hover {
      color: var(--primary);
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background glowing orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <div class="container">
    <header>
      <span class="badge">TOEIC & English Study Guide</span>
      <h1>英文學習與測驗系統</h1>
      <p class="subtitle">為您量身打造的高效複習工具。點選下方卡片開啟您想使用的功能，無論是線上自測或列印紙本考卷皆能快速完成。</p>
    </header>

    <main class="portal-grid">
      <!-- Card 1: Interactive Learning & Quiz App -->
      <a href="quiz.html" class="portal-card card-quiz">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h2 class="card-title">互動式學習與測驗系統</h2>
        <p class="card-desc">線上進行單字中翻英、克漏字與文法測驗，提供即時語音朗讀與答錯字卡彙整，適合每日複習與自測。</p>
        <span class="card-action">
          開啟線上系統
          <svg class="arrow-icon" viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <!-- Card 2: Exam generator sheet -->
      <a href="exam_generator.html" class="portal-card card-exam">
        <div class="icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <h2 class="card-title">A4 雙欄紙本考卷產生器</h2>
        <p class="card-desc">自訂出題單元、題型與題數，一鍵產生符合學測/大考格式的雙欄 A4 考卷與教師版答案解析，方便列印練習。</p>
        <span class="card-action">
          進入產生器
          <svg class="arrow-icon" viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>
    </main>

    <footer>
      <p>高中英文學習雜誌與考卷系統 &copy; 2026. Made with ❤️ for your English success.</p>
    </footer>
  </div>

</body>
</html>
